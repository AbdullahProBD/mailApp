name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.21.0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Reject string-built SQL
        run: |
          if grep -RInE 'sql\.raw[[:space:]]*\(|(execute|query|unsafe)\([^)]*\+' src scripts --include='*.ts'; then
            echo "::error::Raw SQL concatenation is not allowed; use parameterized Drizzle queries."
            exit 1
          fi

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:coverage

      - name: Production build
        run: pnpm build
        env:
          NODE_ENV: production
          OWNER_EMAIL: ci@example.invalid
          SETUP_TOKEN: ci-only-not-a-production-secret-00000000
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/mailapp
          SUPABASE_URL: https://ci.supabase.invalid
          SUPABASE_SERVICE_ROLE_KEY: ci-only-not-a-production-secret-00000000
          ENCRYPTION_KEYS: v1:MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
          SESSION_PEPPER: ci-only-not-a-production-secret-00000000
          CRON_SECRET: ci-only-not-a-production-secret-00000000
          UPSTASH_REDIS_REST_URL: https://ci.upstash.invalid
          UPSTASH_REDIS_REST_TOKEN: ci-only-not-a-production-secret
          APP_URL: https://ci.example.invalid

      - name: Dependency audit
        run: pnpm audit --audit-level high

  migration:
    name: Migrations against Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mailapp
          POSTGRES_PASSWORD: mailapp
          POSTGRES_DB: mailapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mailapp -d mailapp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.21.0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations twice
        run: |
          pnpm db:migrate
          pnpm db:migrate
        env:
          DATABASE_URL: postgresql://mailapp:mailapp@127.0.0.1:5432/mailapp

      - name: Verify deny-all RLS and audit immutability
        run: pnpm db:verify
        env:
          DATABASE_URL: postgresql://mailapp:mailapp@127.0.0.1:5432/mailapp

      - name: Seed refuses production
        run: |
          set +e
          pnpm db:seed
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "::error::Seed must refuse to run in production"
            exit 1
          fi
        env:
          NODE_ENV: production
          DATABASE_URL: postgresql://mailapp:mailapp@127.0.0.1:5432/mailapp
          OWNER_EMAIL: ci@example.invalid
          SETUP_TOKEN: ci-only-not-a-production-secret-00000000
          SUPABASE_URL: https://ci.supabase.invalid
          SUPABASE_SERVICE_ROLE_KEY: ci-only-not-a-production-secret-00000000
          ENCRYPTION_KEYS: v1:MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
          SESSION_PEPPER: ci-only-not-a-production-secret-00000000
          CRON_SECRET: ci-only-not-a-production-secret-00000000
          UPSTASH_REDIS_REST_URL: https://ci.upstash.invalid
          UPSTASH_REDIS_REST_TOKEN: ci-only-not-a-production-secret
          APP_URL: https://ci.example.invalid

  e2e:
    name: End-to-end smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.21.0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: pnpm test:e2e

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Analyze
        uses: github/codeql-action/analyze@v3
